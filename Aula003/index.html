<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca Pokémon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pokedex-container">
        <h1>PokéBusca</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="pokemonInput" 
                placeholder="Digite o nome ou ID do Pokémon..."
            >
            <button id="btn-buscar">Buscar</button>
        </div>

        <div id="resultado" class="resultado-container">
            <!-- O JavaScript vai preencher esta área -->
            <p class="placeholder-text">Digite um Pokémon para começar!</p>
        </div>
    </div>

    <!-- Importante: Chame o seu arquivo JavaScript aqui -->
    <script src="script.js"></script>
</body>
</html>
